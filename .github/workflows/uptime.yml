# Zylo uptime prober.
#
# This is a FRESH workflow file (renamed from the old status-page.yml) on a new
# path so GitHub registers it as a brand-new workflow. A workflow that GitHub
# auto-disabled after 60 days of inactivity stays disabled even after edits, but
# a new file path is enabled by default and shows the "Run workflow" button.
#
# Needs repo setting: Settings > Actions > General > "Allow all actions...".
# Optional secret: ZYLO_API_KEY (without it, models show as Unverified — never faked green).

name: Zylo Uptime Monitor

on:
  schedule:
    # Only the lowest tier (BASIC) TEXT models are live-probed — those are the models
    # that flap and cost nothing to check. Higher-tier ("paid"/GO+) models and ALL
    # image models are asserted stable by the prober and not probed (see
    # PAID_ALWAYS_STABLE / ZYLO_PROBE_IMAGES), so they don't need their own cadence.
    - cron: '0 */4 * * *'    # probe BASIC text models — every 4 hours
  workflow_dispatch:          # manual run; optionally live-probe paid and/or image models too
    inputs:
      paid:
        description: 'Paid (higher-tier) models'
        type: choice
        options: [stable, probe]
        default: stable
      images:
        description: 'Image models (GPU inference — costs money)'
        type: choice
        options: [stable, probe]
        default: stable
  push:
    branches: [ main ]        # manual publish from the admin panel → DEPLOY ONLY (probe skipped)

permissions:
  contents: write
  pages: write
  id-token: write

# Avoid overlapping runs stepping on each other's history commit.
concurrency:
  group: zylo-uptime
  cancel-in-progress: false

# Node 20 is deprecated on GitHub runners (forced to Node 24 from 2026-06-16,
# removed 2026-09-16). This opts the bundled JS actions (checkout / setup-node /
# actions-gh-pages) onto Node 24 now, silencing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the rebase-before-push below works

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # On a push (the admin's manual publish) DON'T re-probe — just deploy the
      # history.json that was committed, so the page shows the manual run verbatim.
      - name: Run status prober
        if: github.event_name != 'push'
        env:
          ZYLO_API_KEY: ${{ secrets.ZYLO_API_KEY }}
          # Paid models are asserted stable by default; a manual dispatch with
          # paid=probe live-checks them instead.
          PAID_ALWAYS_STABLE: ${{ github.event.inputs.paid == 'probe' && '0' || '1' }}
          # Image models are never probed by default (GPU inference costs money on
          # every request); a manual dispatch with images=probe live-checks them.
          ZYLO_PROBE_IMAGES: ${{ github.event.inputs.images == 'probe' && '1' || '0' }}
        run: node probe.js

      # Persist history to main so the 30-check window accumulates across runs.
      # main can advance mid-run (announcements / overrides / manual publishes commit
      # via the API, and runs overlap), so a plain `git push` would fail non-fast-
      # forward and turn the run red ("exit code 1"). Rebase + retry instead. Skipped
      # on push (the prober didn't run, so there's nothing new to commit).
      - name: Commit history updates
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore: update status history [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed history (attempt $i)."
              exit 0
            fi
            echo "Push rejected (main advanced); rebasing and retrying ($i/5)..."
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push history after 5 attempts." >&2
          exit 1

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
