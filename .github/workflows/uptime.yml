# Zylo uptime prober.
#
# This is a FRESH workflow file (renamed from the old status-page.yml) on a new
# path so GitHub registers it as a brand-new workflow. A workflow that GitHub
# auto-disabled after 60 days of inactivity stays disabled even after edits, but
# a new file path is enabled by default and shows the "Run workflow" button.
#
# Needs repo setting: Settings > Actions > General > "Allow all actions...".
# Optional secret: ZYLO_API_KEY (without it, models show as Unverified — never faked green).

name: Zylo Uptime Monitor

on:
  schedule:
    # Two cadences by plan tier (the catalog has BASIC + GO; "free"=lowest tier
    # BASIC, "pro"=higher tier GO). The scope is derived from which cron fired,
    # in the "Determine probe scope" step below.
    - cron: '0 */4 * * *'    # FREE / lowest-tier (BASIC) models — every 4 hours
    - cron: '0 0 * * 0'      # PRO / higher-tier (GO) models — weekly (~every 7 days), Sun 00:00 UTC
  workflow_dispatch:          # manual run button; choose which models to probe
    inputs:
      scope:
        description: 'Which models to probe'
        type: choice
        options: [all, free, pro]
        default: all
  push:
    branches: [ main ]        # manual publish from the admin panel → DEPLOY ONLY (probe skipped)

permissions:
  contents: write
  pages: write
  id-token: write

# Avoid overlapping runs stepping on each other's history commit.
concurrency:
  group: zylo-uptime
  cancel-in-progress: false

# Node 20 is deprecated on GitHub runners (forced to Node 24 from 2026-06-16,
# removed 2026-09-16). This opts the bundled JS actions (checkout / setup-node /
# actions-gh-pages) onto Node 24 now, silencing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the rebase-before-push below works

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Map the trigger → probe scope. Scheduled runs use the cron that fired;
      # a manual dispatch uses its input; a push (admin publish) leaves it 'all'
      # but the prober step is skipped on push anyway.
      - name: Determine probe scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.scope }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * 0" ]; then
            echo "scope=pro" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 */4 * * *" ]; then
            echo "scope=free" >> "$GITHUB_OUTPUT"
          else
            echo "scope=all" >> "$GITHUB_OUTPUT"
          fi

      # On a push (the admin's manual publish) DON'T re-probe — just deploy the
      # history.json that was committed, so the page shows the manual run verbatim.
      - name: Run status prober
        if: github.event_name != 'push'
        env:
          ZYLO_API_KEY: ${{ secrets.ZYLO_API_KEY }}
          PROBE_SCOPE: ${{ steps.scope.outputs.scope }}
        run: node probe.js

      # Persist history to main so the 30-check window accumulates across runs.
      # main can advance mid-run (announcements / overrides / manual publishes commit
      # via the API, and runs overlap), so a plain `git push` would fail non-fast-
      # forward and turn the run red ("exit code 1"). Rebase + retry instead. Skipped
      # on push (the prober didn't run, so there's nothing new to commit).
      - name: Commit history updates
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore: update status history [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed history (attempt $i)."
              exit 0
            fi
            echo "Push rejected (main advanced); rebasing and retrying ($i/5)..."
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push history after 5 attempts." >&2
          exit 1

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
